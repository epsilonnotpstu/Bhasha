<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhasha playground</title>
<style>:root{color-scheme:dark}body{margin:0;font:15px system-ui;background:#10151f;color:#e8edf5}main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1fr);min-height:100vh}section{padding:18px}h1{margin-top:0}textarea,pre{width:100%;box-sizing:border-box;background:#182232;color:#e8edf5;border:1px solid #34445c;border-radius:7px;padding:12px;font:14px ui-monospace,monospace}textarea{height:65vh;resize:vertical}button{background:#57d5a1;border:0;border-radius:6px;padding:9px 14px;font-weight:700;margin:2px}.tabs{display:flex;gap:3px;flex-wrap:wrap}.tabs button{background:#26364d;color:#e8edf5}.tabs button.active{background:#57d5a1;color:#102018}pre{height:65vh;overflow:auto;white-space:pre-wrap}.error{color:#ffb4b4}@media(max-width:760px){main{grid-template-columns:1fr}textarea,pre{height:45vh}}</style>
<main><section><h1>Bhasha playground</h1><textarea id="code">kaj fact(purno n): purno {
  jodi n <= 1 { ferot 1; }
  ferot n * fact(n - 1);
}
dekhao fact(5);</textarea><p><button onclick="go()">Compile &amp; Run</button><button onclick="loadError()">Load error example</button></p></section><section><div class="tabs" id="tabs"></div><pre id="out">Ready. Click Compile &amp; Run.</pre></section></main>
<script>
let result={},active='Output';const names=['Output','Tokens','AST','TAC','Optimized TAC','CFG','Stats','Diagnostics'];
function drawTabs(){tabs.innerHTML='';names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=n===active?'active':'';b.onclick=()=>{active=n;drawTabs();show()};tabs.append(b)})}
function value(){if(active==='Output')return result.output||'';if(active==='Tokens')return JSON.stringify(result.tokens||[],null,2);if(active==='AST')return JSON.stringify(result.ast||{},null,2);if(active==='TAC')return (result.tac||[]).join('\n');if(active==='Optimized TAC')return (result.optTac||[]).join('\n');if(active==='CFG')return result.cfg||'';if(active==='Stats')return JSON.stringify(result.stats||{},null,2);return (result.diagnostics||[]).join('\n\n')}
function show(){out.textContent=value();out.className=(active==='Diagnostics'&&result.diagnostics?.length)?'error':''}
async function go(){let response=await fetch('/api/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:code.value})});result=await response.json();active=result.diagnostics?.length?'Diagnostics':'Output';drawTabs();show()}
function loadError(){code.value='dhoro purno x = @;';go()}drawTabs();
</script></html>
