<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhasha playground</title>
<style>:root{color-scheme:dark}body{margin:0;font:15px system-ui;background:#10151f;color:#e8edf5}main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1fr);min-height:100vh}section{padding:18px}h1{margin-top:0}textarea,pre{width:100%;box-sizing:border-box;background:#182232;color:#e8edf5;border:1px solid #34445c;border-radius:7px;padding:12px;font:14px ui-monospace,monospace}textarea{height:65vh;resize:vertical}button{background:#57d5a1;border:0;border-radius:6px;padding:9px 14px;font-weight:700;margin:2px}.tabs{display:flex;gap:3px;flex-wrap:wrap}.tabs button{background:#26364d;color:#e8edf5}.tabs button.active{background:#57d5a1;color:#102018}pre{height:65vh;overflow:auto;white-space:pre-wrap}.error{color:#ffb4b4}.removed{color:#ffb4b4;background:#4b2029}.added{color:#a6f4ca;background:#173a2a}.diagnostic{display:block;text-align:left;white-space:pre-wrap;width:100%;background:#4b2029;color:#fff;font:inherit}@media(max-width:760px){main{grid-template-columns:1fr}textarea,pre{height:45vh}}</style>
<main><section><h1>Bhasha playground</h1><textarea id="code">kaj fact(purno n): purno {
  jodi n <= 1 { ferot 1; }
  ferot n * fact(n - 1);
}
dekhao fact(5);</textarea><p><label for="programInput">Program input (one value per line)</label><textarea id="programInput" style="height:5em" placeholder="Input for poro"></textarea></p><p><button onclick="go()">Compile &amp; Run</button><button onclick="loadError()">Load error example</button></p></section><section><div class="tabs" id="tabs"></div><pre id="out">Ready. Click Compile &amp; Run.</pre></section></main>
<script>
let result={},active='Output';const names=['Output','Tokens','AST','Symbols','TAC','Optimized TAC','CFG','Stats','Warnings','Diagnostics'];
function drawTabs(){tabs.innerHTML='';names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=n===active?'active':'';b.onclick=()=>{active=n;drawTabs();show()};tabs.append(b)})}
function value(){if(active==='Output')return result.output||'';if(active==='Tokens')return JSON.stringify(result.tokens||[],null,2);if(active==='AST')return JSON.stringify(result.ast||{},null,2);if(active==='Symbols')return JSON.stringify(result.symbols||[],null,2);if(active==='TAC')return (result.tac||[]).join('\n');if(active==='Optimized TAC')return (result.optTac||[]).join('\n');if(active==='CFG')return result.cfg||'';if(active==='Stats')return JSON.stringify(result.stats||{},null,2);if(active==='Warnings')return (result.warnings||[]).join('\n\n');return (result.diagnostics||[]).join('\n\n')}
function cfgSvg(){let b=result.cfgBlocks||[],e=result.cfgEdges||[],h=Math.max(180,b.length*105),boxes=b.map((x,i)=>`<g><rect x="30" y="${20+i*90}" width="500" height="62" rx="7"/><text x="42" y="${40+i*90}">B${i}: ${x.join(' | ').replaceAll('&','&amp;').replaceAll('<','&lt;')}</text></g>`).join('');let lines=e.map(([a,z])=>`<path d="M280 ${82+a*90} L280 ${20+z*90}" marker-end="url(#arrow)"/>`).join('');return `<svg viewBox="0 0 570 ${h}" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z"/></marker></defs><style>rect{fill:#182232;stroke:#57d5a1}text{fill:#e8edf5;font:12px monospace}path{stroke:#7f9cbf;fill:none}</style>${lines}${boxes}</svg>`}
function selectDiagnostic(item){let lines=code.value.split('\n'),start=lines.slice(0,item.line-1).reduce((n,s)=>n+s.length+1,0);code.focus();code.setSelectionRange(start,start+(lines[item.line-1]||'').length)}
function show(){out.className=(active==='Diagnostics'&&result.diagnostics?.length)?'error':'';if(active==='CFG'&&result.cfgBlocks){out.innerHTML=cfgSvg()+`<hr><code>${(result.cfg||'').replaceAll('&','&amp;').replaceAll('<','&lt;')}</code>`}else if(active==='Optimized TAC'&&result.tacDiff){out.replaceChildren();result.tacDiff.forEach(item=>{let row=document.createElement('div');row.className=item.kind;row.textContent=(item.kind==='removed'?'- ':item.kind==='added'?'+ ':'  ')+item.line;out.append(row)})}else if(active==='Diagnostics'&&result.diagnosticItems?.length){out.replaceChildren();result.diagnosticItems.forEach(item=>{let button=document.createElement('button');button.className='diagnostic';button.textContent=item.rendered;button.onclick=()=>selectDiagnostic(item);out.append(button)})}else{out.textContent=value()}}
async function go(){let response=await fetch('/api/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:code.value,input:document.getElementById('programInput').value})});result=await response.json();active=result.diagnostics?.length?'Diagnostics':'Output';code.style.borderColor=result.diagnostics?.length?'#ff7777':'#34445c';drawTabs();show()}
function loadError(){code.value='dhoro purno x = @;';go()}drawTabs();
</script></html>
